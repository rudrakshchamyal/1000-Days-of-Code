<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rockwell Automation | Global Events Radar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        .rockwell-hero {
            background: linear-gradient(135deg, #111 0%, #333 100%);
            color: white;
            padding: 40px 0 100px 0; 
            border-bottom: 5px solid #cc0000;
        }
        .brand-red { color: #cc0000 !important; font-weight: 800; }
        .dashboard-container { margin-top: -60px; }
        .data-card {
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            background: white;
        }
        .data-card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(204,0,0,0.15); }
        .date-box {
            background: #f8f9fa;
            border-right: 3px solid #cc0000;
            min-width: 80px;
            text-align: center;
        }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white py-3 shadow-sm">
        <div class="container-fluid px-5">
            <span class="navbar-brand brand-red fs-4">Rockwell Automation</span>
            <span class="text-secondary fw-semibold ms-2 border-start ps-3">Events Radar v2.5</span>
        </div>
    </nav>

    <div class="rockwell-hero">
        <div class="container-fluid px-5">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <h2 class="fw-bold mb-1">Global Training & Events Array</h2>
                    <p class="mb-0 text-muted">Hybrid Mode: Live connection with secure architectural fallback.</p>
                </div>
                <div class="col-md-4 text-md-end mt-3 mt-md-0">
                    <button id="apiButton" class="btn btn-danger fw-bold px-4 py-2 shadow">
                        SYNC LIVE EVENTS
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid px-5 dashboard-container">
        <div id="statusStream" class="mb-3"></div>

        <div id="dataDisplay" class="row g-4">
            <div class="col-12">
                <div class="card data-card p-5 text-center text-muted">
                    <h4>📡 System Standby</h4>
                    <p>Click 'Sync Live Events' to initialize the gateway search parameters.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const display = document.getElementById("dataDisplay");
        const button = document.getElementById("apiButton");
        const statusStream = document.getElementById("statusStream");

        button.addEventListener("click", async function() {
            button.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> SYNCING...`;
            button.disabled = true;
            statusStream.innerHTML = ""; 

            let eventsData = [];
            let dataSource = "LIVE_STREAM";

            try {
                // 1. Target Endpoint
                const targetUrl = 'https://www.rockwellautomation.com/en-us/events/jcr:content/root/main-par/generic_container/GenericContainerParsys/column_control/Col1/generic_filter.genericSearch.json?rootPath=%2Fcontent%2Frockwell-automation%2Fglobal%2Fna%2Fen&deepCount=false&upcomingEventsFlag=true&contentType=event-in-person&contentType=event-virtual&sort=eventAsc&numPerPage=24&page=1';
                
                // 2. Network Fetch Attempt
                const response = await fetch(targetUrl);
                if (!response.ok) throw new Error("Server rejected request configuration");
                
                const rawData = await response.json();
                eventsData = rawData.items || rawData.results || [];
                
                statusStream.innerHTML = `<div class="badge bg-success p-2 shadow-sm">🟢 LIVE DATA CONNECTED SUCCESSFULLY</div>`;

            } catch (error) {
                // 3. Fallback Mechanism (Triggered when corporate firewalls block local origins)
                console.warn("Network gateway blocked. Initializing local data stream asset...", error);
                dataSource = "LOCAL_FALLBACK";
                
                // Realistic data array modeled exactly after the genericSearch structure
                eventsData = [
                    {
                        title: "Automation Fair 2026",
                        location: "Chicago, IL",
                        startDate: "November 16, 2026",
                        url: "/events/automation-fair.html"
                    },
                    {
                        title: "RAOTM: Rockwell Automation On The Move",
                        location: "Noida, India",
                        startDate: "September 08, 2026",
                        url: "/events/raotm.html"
                    },
                    {
                        title: "ControlLogix 5580 Advanced System Configuration Training",
                        location: "Online / Virtual",
                        startDate: "August 14, 2026",
                        url: "/training/logix-advanced.html"
                    }
                ];

                statusStream.innerHTML = `
                    <div class="badge bg-warning text-dark p-2 shadow-sm">
                        ⚠️ NETWORK BLOCKED (CORS/FIREWALL) — RUNNING SECURE ARCHITECTURAL FALLBACK
                    </div>`;
            }

            // 4. Render Engine Loop
            display.innerHTML = ""; 

            if (eventsData.length === 0) {
                display.innerHTML = `<div class="col-12"><div class="alert alert-warning">No upcoming items resolved in data stream.</div></div>`;
                button.innerHTML = "SYNC LIVE EVENTS";
                button.disabled = false;
                return;
            }

            eventsData.forEach(event => {
                const title = event.title || event.pageTitle || "Untitled Schedule Item";
const location = event.location || "Global Schedule / TBD";
const eventUrl = event.url || event.path || "#";

// Translate the raw ISO database string into a human-readable format
let formattedDate = "Date Unspecified";
const rawDate = event.startDate || event.date;
if (rawDate) {
    formattedDate = new Date(rawDate).toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'short',
        day: 'numeric'
    });
}

                display.innerHTML += `
                    <div class="col-md-4">
                        <div class="card data-card h-100 flex-row overflow-hidden">
                            <div class="date-box p-3 d-flex flex-column justify-content-center">
                                <span class="fs-3">📅</span>
                            </div>
                            <div class="p-4 d-flex flex-column w-100">
                                <div class="mb-1">
                                    <span class="badge bg-danger bg-opacity-10 text-danger fw-bold text-uppercase" style="font-size: 0.7rem;">${location}</span>
                                </div>
                                <h6 class="fw-bold text-dark mb-3">${title}</h6>
                                <div class="mt-auto pt-2 border-top d-flex justify-content-between align-items-center">
                                    <small class="text-muted fw-semibold">${formattedDate}</small>
                                    <a href="https://www.rockwellautomation.com${eventUrl}" target="_blank" class="btn btn-sm btn-outline-danger py-0 px-2" style="font-size: 0.8rem;">View</a>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            button.innerHTML = "SYNC LIVE EVENTS";
            button.disabled = false;
        });
    </script>
</body>
</html>
