<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rockwell Automation Dashboard</title>
    <!-- Bootstrap CSS for layout -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Our Custom CSS to match the image -->
    <style>
        /* The exact Red-to-Orange gradient from the Rockwell image */
        .rockwell-hero {
            background: linear-gradient(135deg, #b8122a 0%, #e22b26 45%, #f26f24 100%);
            color: white;
            padding: 80px 0 120px 0; 
        }

        /* Styling the logo text */
        .brand-red {
            color: #cc0000 !important;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        /* Recreating the "DOWNLOAD REPORT" button style */
        .rockwell-btn {
            background-color: #ffffff;
            color: #0073e6; /* The specific blue text */
            font-weight: 700;
            border: none;
            padding: 12px 28px;
            border-radius: 4px;
            font-size: 14px;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }

        .rockwell-btn:hover {
            background-color: #f1f1f1;
            color: #005bb5;
        }

        /* Lifting the data card up so it overlaps the red background */
        .dashboard-card {
            margin-top: -60px;
            box-shadow: 0 12px 24px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body class="bg-light">

    <!-- Top Navigation Bar (White background, matching the image header) -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm py-3">
        <div class="container">
            <span class="navbar-brand brand-red fs-3">Rockwell Automation</span>
            <span class="text-secondary fw-semibold ms-2 border-start ps-3">Internship Project Dashboard</span>
        </div>
    </nav>

    <!-- The Hero Background Area -->
    <div class="rockwell-hero">
        <div class="container">
            <div class="row">
                <div class="col-lg-7">
                    <!-- Giant text matching the layout style -->
                    <h1 class="display-4 fw-bold mb-3">Live System Status & Data</h1>
                    <p class="lead mb-4">Monitoring real-time industrial parameters, benchmarks, and operational strategy trends.</p>
                    
                    <!-- Our API trigger button disguised as a corporate CTA -->
                    <button id="apiButton" class="rockwell-btn">FETCH SERVER DATA</button>
                </div>
            </div>
        </div>
    </div>

    <!-- The Data Display Area (Lifted over the gradient) -->
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12">
                <div class="card dashboard-card border-0 rounded-3">
                    <div class="card-body p-4 p-md-5">
                        <h4 class="text-dark fw-bold mb-4">API Response Output</h4>
                        
                        <!-- The exact spot the DOM will inject our data -->
                        <div id="dataDisplay" class="p-5 bg-light border rounded text-center text-muted border-dashed">
                            System waiting for trigger event...
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- The DOM Logic -->
    <!-- The DOM Logic -->
    <script>
        const display = document.getElementById("dataDisplay");
        const button = document.getElementById("apiButton");

        // Notice the 'async' keyword here. It allows us to wait for the internet.
        button.addEventListener("click", async function() {
            
            // 1. UI Loading State
            display.textContent = "Connecting to secure endpoint...";
            display.classList.remove("text-muted", "bg-light");
            display.classList.add("text-primary", "bg-white", "border-primary");
            
            button.textContent = "PROCESSING...";
            button.disabled = true;
            button.style.opacity = "0.7";

            try {
                // 2. The REST API Call (Fetching data over the internet)
                const response = await fetch('https://jsonplaceholder.typicode.com/users/1');
                
                // Check if the server actually responded successfully
                if (!response.ok) {
                    throw new Error("Network response was not ok");
                }

                // 3. Parse the response into a JavaScript Object (JSON)
                const data = await response.json();

                // 4. Inject the data into the DOM using Template Literals (the backticks)
                display.innerHTML = `
                    <div class="text-start">
                        <h5 class="text-dark border-bottom pb-2 fw-bold">System Diagnostics</h5>
                        <p class="mb-1 text-dark"><strong>Operator ID:</strong> ${data.username}</p>
                        <p class="mb-1 text-dark"><strong>Assigned Sector:</strong> ${data.company.name}</p>
                        <p class="mb-0 text-success fw-bold"><strong>Network Status:</strong> Online - Code 200 OK</p>
                    </div>
                `;
            } catch (error) {
                // 5. Handle any errors (like no internet connection) gracefully
                display.innerHTML = `<span class="text-danger fw-bold">Error: Connection to server failed.</span>`;
            } finally {
                // 6. Reset the button so the user can click it again
                button.textContent = "FETCH SERVER DATA";
                button.disabled = false;
                button.style.opacity = "1";
            }
        });
    </script>

</body>
</html>
