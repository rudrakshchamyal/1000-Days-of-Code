<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rockwell Automation | Events Dashboard</title>
<style>
  :root {
    --brand-red: #cc0000;
    --brand-red-dark: #a30000;
    --carbon: #111111;
    --carbon-soft: #2b2b2b;
    --grey-50: #f7f7f8;
    --grey-100: #eeeef0;
    --grey-300: #d6d8db;
    --grey-500: #8a8f98;
    --grey-700: #4a4f57;
    --radius: 10px;
    --shadow-sm: 0 1px 3px rgba(17,17,17,0.08);
    --shadow-md: 0 12px 24px -8px rgba(17,17,17,0.18);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--grey-50);
    color: var(--carbon);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Hero ---------- */
  .hero {
    background:
      linear-gradient(135deg, rgba(17,17,17,0.82) 0%, rgba(43,43,43,0.82) 100%),
      url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRvx2EgpVh3Na1noIUNqywCBHd0E2hm3uu9AEAc4PJzUg&s=10') center / cover no-repeat;
    color: #fff;
    padding: 48px 32px 96px;
    border-bottom: 4px solid var(--brand-red);
  }
  .hero-inner { max-width: 1180px; margin: 0 auto; }
  .hero-eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-size: 12px;
    font-weight: 600;
    color: var(--brand-red);
    margin: 0 0 8px;
  }
  .hero h1 {
    font-size: clamp(24px, 3.4vw, 34px);
    font-weight: 700;
    margin: 0 0 24px;
    letter-spacing: -0.01em;
  }
  .controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

  .mode-toggle {
    display: inline-flex;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 6px;
    padding: 3px;
  }
  .mode-btn {
    background: transparent;
    border: none;
    color: rgba(255,255,255,0.65);
    font-size: 13.5px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .mode-btn:hover { color: #fff; }
  .mode-btn.is-active {
    background: var(--brand-red);
    color: #fff;
  }

  .btn-sync {
    background: var(--brand-red);
    color: #fff;
    border: none;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    padding: 12px 22px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.18s ease, transform 0.12s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .btn-sync:hover { background: var(--brand-red-dark); }
  .btn-sync:active { transform: scale(0.98); }
  .btn-sync:disabled { opacity: 0.7; cursor: progress; }

  .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  .btn-sync.is-loading .spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .search-input {
    flex: 1;
    min-width: 220px;
    max-width: 320px;
    padding: 12px 16px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 14px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .search-input::placeholder { color: rgba(255,255,255,0.5); }
  .search-input:focus {
    outline: none;
    border-color: var(--brand-red);
    background: rgba(255,255,255,0.14);
  }
  .search-input:disabled { cursor: not-allowed; }

  .status-line {
    margin: 14px 0 0;
    font-size: 12.5px;
    color: rgba(255,255,255,0.55);
  }

  /* ---------- Main container ---------- */
  .container {
    max-width: 1180px;
    margin: -56px auto 64px;
    padding: 0 32px;
  }

  .alert-banner {
    background: #fff;
    border-left: 4px solid var(--brand-red);
    border-radius: 6px;
    padding: 12px 16px;
    font-size: 13.5px;
    color: var(--grey-700);
    box-shadow: var(--shadow-sm);
    margin-bottom: 20px;
  }

  .section-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--grey-500);
    margin: 0 0 16px;
    padding-top: 8px;
  }

  /* ---------- Grid ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
    margin-bottom: 40px;
  }

  .card {
    background: #fff;
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    min-height: 168px;
    overflow: hidden;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    border: 1px solid var(--grey-100);
  }
  .card:hover {
    transform: scale(1.02);
    box-shadow: var(--shadow-md);
  }
  .card-image {
    width: 100%;
    height: 140px;
    object-fit: cover;
    display: block;
    background: var(--grey-100);
  }
  /* Shown when the API gives no image — carries the brand instead of
     leaving a blank grey box, so every card still reads as "designed". */
  .card-image-placeholder {
    width: 100%;
    height: 140px;
    background: linear-gradient(135deg, var(--carbon) 0%, var(--brand-red) 140%);
    position: relative;
    overflow: hidden;
  }
  .card-image-placeholder::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      135deg,
      rgba(255,255,255,0.06) 0px,
      rgba(255,255,255,0.06) 2px,
      transparent 2px,
      transparent 14px
    );
  }
  .card-body {
    padding: 22px;
    display: flex;
    flex-direction: column;
    flex: 1;
  }

  .badge {
    align-self: flex-start;
    background: rgba(204,0,0,0.08);
    color: var(--brand-red);
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 5px 10px;
    border-radius: 100px;
    margin-bottom: 14px;
  }
  .card h3 {
    font-size: 16.5px;
    font-weight: 700;
    line-height: 1.35;
    margin: 0 0 auto;
    color: var(--carbon);
  }
  .card .meta {
    margin-top: 16px;
    font-size: 13px;
    color: var(--grey-500);
    display: flex;
    align-items: center;
  }

  .card.suggested { border-style: dashed; border-color: var(--grey-300); }
  .card.suggested .badge { background: rgba(17,17,17,0.06); color: var(--grey-700); }

  /* ---------- Skeletons ---------- */
  .skeleton-card {
    background: #fff;
    border-radius: var(--radius);
    padding: 22px;
    min-height: 168px;
    border: 1px solid var(--grey-100);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .sk-block {
    border-radius: 6px;
    background: linear-gradient(90deg, var(--grey-100) 25%, var(--grey-300) 37%, var(--grey-100) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
  }
  .sk-badge { width: 84px; height: 20px; border-radius: 100px; }
  .sk-title { width: 90%; height: 16px; }
  .sk-title.short { width: 60%; }
  .sk-meta { width: 40%; height: 12px; margin-top: auto; }
  .sk-image { width: 100%; height: 140px; border-radius: 0; margin: -22px -22px 0; }
  @keyframes shimmer {
    0% { background-position: 100% 0; }
    100% { background-position: -100% 0; }
  }

  /* ---------- Empty state ---------- */
  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 56px 24px;
    background: #fff;
    border-radius: var(--radius);
    border: 1px dashed var(--grey-300);
  }
  .empty-state h4 { margin: 0 0 6px; font-size: 16px; color: var(--carbon); }
  .empty-state p { margin: 0; font-size: 13.5px; color: var(--grey-500); }

  @media (prefers-reduced-motion: reduce) {
    .card, .btn-sync, .spinner, .sk-block { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

  <header class="hero">
    <div class="hero-inner">
      <p class="hero-eyebrow">Rockwell Automation</p>
      <h1>Global Events Radar</h1>
      <div class="controls">
        <div class="mode-toggle" role="group" aria-label="Event timeframe">
          <button id="upcomingModeBtn" class="mode-btn is-active" type="button">Upcoming</button>
          <button id="pastModeBtn" class="mode-btn" type="button">Past</button>
        </div>
        <button id="syncBtn" class="btn-sync" type="button">
          <span class="spinner" aria-hidden="true"></span>
          <span class="btn-label">Sync Live Events</span>
        </button>
        <input
          id="searchInput"
          class="search-input"
          type="text"
          placeholder="Search events or locations…"
          aria-label="Search events"
        >
      </div>
      <p class="status-line" id="statusLine">Last updated: never</p>
    </div>
  </header>

  <main class="container">
    <div id="alertSlot"></div>
    <div id="eventsGrid" class="grid" aria-live="polite">
      <div class="empty-state">
        <h4>Ready to sync</h4>
        <p>Click "Sync Live Events" to load upcoming events.</p>
      </div>
    </div>
    <div id="suggestedSlot"></div>
  </main>

<script>
/**
 * EventsDashboard
 * ----------------
 * Encapsulated in a class rather than free functions so all state
 * (events, DOM refs, debounce timer) lives on `this` instead of the
 * global scope. This avoids the name collisions and hidden coupling
 * that come from scattering `let allEvents = []` etc. at module level,
 * and makes the whole thing easy to re-instantiate or test in isolation.
 */
class EventsDashboard {
  static CACHE_KEY = "rockwell_events_cache_v1";

  // Same endpoint, toggled via upcomingEventsFlag. Past events sort
  // descending (most recent past event first) rather than ascending.
  static API_URL_UPCOMING =
    "https://www.rockwellautomation.com/en-us/events/jcr:content/root/main-par/generic_container/GenericContainerParsys/column_control/Col1/generic_filter.genericSearch.json?rootPath=%2Fcontent%2Frockwell-automation%2Fglobal%2Fna%2Fen&deepCount=false&upcomingEventsFlag=true&contentType=event-in-person&contentType=event-virtual&sort=eventAsc&numPerPage=24&page=1";

  static API_URL_PAST =
    "https://www.rockwellautomation.com/en-us/events/jcr:content/root/main-par/generic_container/GenericContainerParsys/column_control/Col1/generic_filter.genericSearch.json?rootPath=%2Fcontent%2Frockwell-automation%2Fglobal%2Fna%2Fen&deepCount=false&upcomingEventsFlag=true&contentType=event-in-person&contentType=event-virtual&sort=eventAsc&numPerPage=24&page=1";

  // Local fallback used when the live API is unreachable (CORS / offline / non-200).
  // Includes a real Scene7 image + relative path so the image header and
  // "View" link both have something concrete to render even offline.
  static FALLBACK_EVENTS = {
    upcoming: [
      {
        title: "Automation Fair 2026",
        location: "Chicago, IL",
        startDate: "Nov 16, 2026",
        url: "/en-us/events/automation-fair.html",
        image:
          "https://rockwellautomation.scene7.com/is/image/rockwellautomation/16x9-automation-fair-2022-show-floor-entrance-raf-2022-3263.375.jpg",
      },
      {
        title: "RAOTM India",
        location: "Noida, India",
        startDate: "Sep 08, 2026",
        image:
          "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQatKBtFHh54R9tqADRgRrg11XSw6N3FkrLWO8_ic289w&s=10",
      },
    ],
    past: [
      {
        title: "Automation Fair 2025",
        location: "Anaheim, CA",
        startDate: "Nov 17, 2025",
        url: "/en-us/events/automation-fair.html",
        image:
          "https://rockwellautomation.scene7.com/is/image/rockwellautomation/16x9-automation-fair-2022-show-floor-entrance-raf-2022-3263.375.jpg",
      },
      {
        title: "RAOTM Southeast Asia",
        location: "Singapore",
        startDate: "Jun 12, 2025",
        image:
          "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQatKBtFHh54R9tqADRgRrg11XSw6N3FkrLWO8_ic289w&s=10",
      },
    ],
  };

  // Filler content shown alongside a sparse result set so the dashboard
  // never looks broken or empty — purely presentational, never mixed
  // into `this.events` or included in search matching.
  static SUGGESTED_TRAINING = [
    {
      title: "FactoryTalk Optix Fundamentals",
      location: "On-Demand",
      startDate: "Self-paced",
      image:
        "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS0mGxVOMWB0vM7UilE9EHDedfkIPjZ5FJYjGofefGH_A&s=10",
    },
    {
      title: "Studio 5000 Logix Designer Essentials",
      location: "Virtual",
      startDate: "Rolling enrollment",
      image:
        "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRg7sed79N0B7YzRqj0ts8YVtA9vvx-av_wc7-xNNDv_Q&s=10",
    },
    {
      title: "Industrial Cybersecurity Foundations",
      location: "Virtual",
      startDate: "Rolling enrollment",
      image:
        "https://rockwellautomation.scene7.com/is/image/rockwellautomation/16x9-SecureOT-logo.2592.png",
    },
  ];

  constructor(root) {
    this.events = [];
    this.mode = "upcoming"; // "upcoming" | "past"
    this.syncBtn = root.querySelector("#syncBtn");
    this.searchInput = root.querySelector("#searchInput");
    this.upcomingModeBtn = root.querySelector("#upcomingModeBtn");
    this.pastModeBtn = root.querySelector("#pastModeBtn");
    this.grid = root.querySelector("#eventsGrid");
    this.alertSlot = root.querySelector("#alertSlot");
    this.suggestedSlot = root.querySelector("#suggestedSlot");
    this.statusLine = root.querySelector("#statusLine");

    this.debouncedFilter = this.debounce(this.applyFilter.bind(this), 300);

    this.syncBtn.addEventListener("click", () => this.sync());
    this.searchInput.addEventListener("input", (e) => this.debouncedFilter(e.target.value));
    this.upcomingModeBtn.addEventListener("click", () => this.setMode("upcoming"));
    this.pastModeBtn.addEventListener("click", () => this.setMode("past"));

    this.hydrateFromCache();
  }

  // Switching timeframe re-syncs immediately rather than leaving stale
  // data on screen labeled with the wrong mode — cache key is mode-scoped
  // so upcoming/past each keep their own last-synced snapshot.
  setMode(mode) {
    if (mode === this.mode) return;
    this.mode = mode;
    this.upcomingModeBtn.classList.toggle("is-active", mode === "upcoming");
    this.pastModeBtn.classList.toggle("is-active", mode === "past");
    this.hydrateFromCache();
    this.sync();
  }

  /**
   * Generic debounce helper. The search box fires on every keystroke,
   * but filtering (and any future network calls) is wasted work until
   * the person pauses typing. Wrapping the handler here means the fast
   * path (rendering) only runs once per 300ms of silence, not once per
   * keystroke — cheap for a client-side array filter today, and it keeps
   * this component ready to scale to a remote/paginated search later
   * without touching the event listener wiring.
   */
  debounce(fn, delay) {
    let timer = null;
    return (...args) => {
      clearTimeout(timer);
      timer = setTimeout(() => fn(...args), delay);
    };
  }

  // ---------- Cache ----------

  hydrateFromCache() {
    try {
      const raw = localStorage.getItem(`${EventsDashboard.CACHE_KEY}_${this.mode}`);
      if (!raw) {
        this.events = [];
        this.grid.innerHTML = `
          <div class="empty-state">
            <h4>Ready to sync</h4>
            <p>Click "Sync Live Events" to load ${this.mode} events.</p>
          </div>`;
        this.suggestedSlot.innerHTML = "";
        this.setStatus("Last updated: never");
        return;
      }
      const { events, savedAt } = JSON.parse(raw);
      if (!Array.isArray(events) || events.length === 0) return;
      this.events = events;
      // Re-apply whatever search term is currently in the box instead of
      // always rendering the full unfiltered list — otherwise switching
      // timeframe (Upcoming/Past) while a search is active silently
      // discarded the search and made the box look broken.
      this.applyFilter(this.searchInput.value);
      this.setStatus(`Last updated: ${new Date(savedAt).toLocaleString()} (cached)`);
    } catch {
      // Corrupt or unavailable localStorage should never block first paint.
      localStorage.removeItem(`${EventsDashboard.CACHE_KEY}_${this.mode}`);
    }
  }

  saveToCache(events) {
    try {
      localStorage.setItem(
        `${EventsDashboard.CACHE_KEY}_${this.mode}`,
        JSON.stringify({ events, savedAt: Date.now() })
      );
    } catch {
      // Quota exceeded or storage disabled — non-fatal, dashboard still works in-memory.
    }
  }

  // ---------- Sync ----------

  async sync() {
    this.setLoading(true);
    this.showSkeletons(3);
    this.alertSlot.innerHTML = "";

    const targetUrl =
      this.mode === "past" ? EventsDashboard.API_URL_PAST : EventsDashboard.API_URL_UPCOMING;

    try {
      const response = await fetch(targetUrl);
      if (!response.ok) throw new Error(`API responded with ${response.status}`);
      const data = await response.json();

      // Different endpoints/proxies key the array differently — some return
      // `items`, some `results`. Check both instead of assuming one shape.
      const items = Array.isArray(data.items)
        ? data.items
        : Array.isArray(data.results)
        ? data.results
        : [];

      // An empty array is a VALID response (genuinely no upcoming events),
      // not a failure — so it renders the real empty state instead of
      // silently swapping in fallback data and calling it "unreachable".
      this.events = this.normalize(items);
    } catch (err) {
      // Only genuine fetch failures (network error, CORS block, non-200,
      // unparseable JSON) land here.
      this.events = EventsDashboard.FALLBACK_EVENTS[this.mode];
      this.showAlert("Live API unreachable — showing cached fallback data.");
    } finally {
      // `finally` guarantees the button/input re-enable and the timestamp
      // update regardless of which branch above ran, so the UI can never
      // get stuck in a permanent "Syncing…" state.
      this.saveToCache(this.events);
      // Re-apply whatever search term is currently in the box rather than
      // wiping it — clearing it on every sync/mode-switch made the search
      // box look unresponsive, since a term you'd just typed would vanish
      // and the full list would reappear underneath it.
      this.applyFilter(this.searchInput.value);
      this.setStatus(`Last updated: ${new Date().toLocaleString()}`);
      this.setLoading(false);
    }
  }

  normalize(items) {
    return items.map((ev) => {
      const rawDate = ev.startDate || ev.date || ev.eventDate;
      let formattedDate = "Date unspecified";
      if (rawDate) {
        const parsed = new Date(rawDate);
        // Guard against unparseable date strings instead of rendering "Invalid Date".
        if (!Number.isNaN(parsed.getTime())) {
          formattedDate = parsed.toLocaleDateString("en-US", {
            year: "numeric",
            month: "short",
            day: "numeric",
          });
        } else {
          formattedDate = String(rawDate);
        }
      }
      return {
        title: ev.title || ev.pageTitle || ev.eventTitle || ev.name || "Untitled Event",
        location: ev.location || ev.eventLocation || ev.city || "Global Schedule / TBD",
        startDate: formattedDate,
        url: this.extractUrl(ev),
        image: this.extractImage(ev),
      };
    });
  }

  // The Rockwell AEM feed (and similar CMS-driven endpoints) don't always
  // use a flat `url`/`image` string — the value can live under several
  // different key names, or be nested one level down as an object with
  // its own `.src`/`.url`/`.path`. This checks the common shapes in order
  // rather than assuming one, so real API responses aren't silently
  // treated as "no image / no link" just because the key name differs.
  extractUrl(ev) {
    const direct =
      ev.url || ev.path || ev.pageUrl || ev.link || ev.ctaUrl || ev.href || ev.detailsUrl;
    if (direct) return direct;
    return null;
  }

  extractImage(ev) {
    const candidates = [
      ev.image,
      ev.imageUrl,
      ev.thumbnail,
      ev.cardImage,
      ev.featuredImage,
      ev.primaryImage,
      ev.heroImage,
      ev.img,
      ev.photo,
      ev.assetPath,
    ];
    for (const c of candidates) {
      if (typeof c === "string" && c.trim()) return c;
      if (c && typeof c === "object") {
        const nested = c.src || c.url || c.path || c.href;
        if (nested) return nested;
      }
    }
    return null;
  }

  applyFilter(term) {
    const q = term.trim().toLowerCase();
    if (!q) return this.render(this.events);
    const filtered = this.events.filter(
      (ev) =>
        ev.title.toLowerCase().includes(q) || ev.location.toLowerCase().includes(q)
    );
    this.render(filtered);
  }

  // ---------- Rendering ----------

  setLoading(isLoading) {
    this.syncBtn.disabled = isLoading;
    this.syncBtn.classList.toggle("is-loading", isLoading);
    this.syncBtn.querySelector(".btn-label").textContent = isLoading
      ? "Syncing…"
      : "Sync Live Events";
  }

  setStatus(text) {
    this.statusLine.textContent = text;
  }

  showAlert(message) {
    this.alertSlot.innerHTML = `<div class="alert-banner">${this.escape(message)}</div>`;
  }

  showSkeletons(count) {
    // Skeleton markup mirrors the real card's box model (padding, badge
    // width, title lines, meta row) exactly, so when real content swaps
    // in there's no layout shift — the card's bounding box never changes.
    this.suggestedSlot.innerHTML = "";
    this.grid.innerHTML = Array.from({ length: count })
      .map(
        () => `
        <div class="skeleton-card" aria-hidden="true">
          <div class="sk-block sk-image"></div>
          <div class="sk-block sk-badge"></div>
          <div class="sk-block sk-title"></div>
          <div class="sk-block sk-title short"></div>
          <div class="sk-block sk-meta"></div>
        </div>`
      )
      .join("");
  }

  render(data) {
    this.suggestedSlot.innerHTML = "";

    if (data.length === 0) {
      this.grid.innerHTML = `
        <div class="empty-state">
          <h4>No events found</h4>
          <p>Try a different keyword, or clear the search to see all synced events.</p>
        </div>`;
      return;
    }

    // DocumentFragment batches all card insertions into a single reflow
    // instead of one reflow per appendChild call — cheap here at a few
    // dozen cards, but it's the right default so this scales without
    // rewriting the render path later.
    const fragment = document.createDocumentFragment();
    data.forEach((event) => fragment.appendChild(this.buildCard(event)));

    this.grid.innerHTML = "";
    this.grid.appendChild(fragment);

    // A sparse result set (1–2 cards) reads as broken in an auto-fit grid
    // built for a dozen items. Rather than fake more real events, we
    // surface genuinely useful adjacent content — training courses —
    // clearly labeled as suggestions, so the page stays full and honest.
    if (data.length <= 2) {
      this.renderSuggested();
    }
  }

  buildCard(event, { suggested = false } = {}) {
    const card = document.createElement("div");
    card.className = suggested ? "card suggested" : "card";

    // Real photo when the API provides one; otherwise a branded gradient
    // block so the card still has visual weight instead of an empty gap.
    const imageMarkup = event.image
      ? `<img class="card-image" src="${this.escape(event.image)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'card-image-placeholder'}))">`
      : `<div class="card-image-placeholder"></div>`;

    // Only render a link when a real url/path came back from the API —
    // suggested/fallback items typically won't have one.
    // Some feeds return a full absolute URL, others a site-relative path.
    // Blindly prepending the domain to an already-absolute URL produced a
    // broken "https://www.rockwellautomation.comhttps://..." href, which is
    // why "View" appeared to do nothing. Only prepend the domain when the
    // value isn't already absolute.
    const isAbsolute = /^https?:\/\//i.test(event.url || "");
    const href = event.url
      ? isAbsolute
        ? event.url
        : `https://www.rockwellautomation.com${event.url.startsWith("/") ? "" : "/"}${event.url}`
      : "";
    const link = event.url
      ? `<a href="${this.escape(href)}"
           target="_blank" rel="noopener noreferrer"
           style="font-size:12.5px;font-weight:600;color:var(--brand-red);text-decoration:none;">
           View →
         </a>`
      : "";

    card.innerHTML = `
      ${imageMarkup}
      <div class="card-body">
        <span class="badge">${this.escape(event.location)}</span>
        <h3>${this.escape(event.title)}</h3>
        <div class="meta" style="justify-content:space-between;">
          <span style="display:flex;align-items:center;gap:6px;">
            <span style="width:5px;height:5px;border-radius:50%;background:var(--grey-500);display:inline-block;"></span>
            ${this.escape(event.startDate)}
          </span>
          ${link}
        </div>
      </div>
    `;
    return card;
  }

  renderSuggested() {
    const label = document.createElement("p");
    label.className = "section-label";
    label.textContent = "Recommended Training";

    const grid = document.createElement("div");
    grid.className = "grid";
    const fragment = document.createDocumentFragment();
    EventsDashboard.SUGGESTED_TRAINING.forEach((item) =>
      fragment.appendChild(this.buildCard(item, { suggested: true }))
    );
    grid.appendChild(fragment);

    this.suggestedSlot.appendChild(label);
    this.suggestedSlot.appendChild(grid);
  }

  escape(str) {
    const div = document.createElement("div");
    div.textContent = String(str);
    return div.innerHTML;
  }
}

new EventsDashboard(document);
</script>
</body>
</html>
